<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img"><title>Silberhalogenid-Niederschläge und ihr Verhalten in Ammoniak-Lösung</title>
